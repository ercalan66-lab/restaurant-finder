      {id:16,name:"Kigamboni Sands",cuisine:"African",area:"Kigamboni",price:"TSh 105,000",cost:105000,rating:4.7,distance:9.8,open:"Lunch",facilities:["Parking","Outdoor","Accessible"],diet:["Halal","Gluten-free"],tag:"Weekend pick",photo:"https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=800&q=85",description:"A relaxed beach escape for seafood, barbecue, and family lunches."},
      {id:17,name:"Kijitonyama Table",cuisine:"African",area:"Kijitonyama",price:"TSh 38,000",cost:38000,rating:4.5,distance:5.6,open:"Lunch",facilities:["Delivery","Wi-Fi"],diet:["Halal"],tag:"Quick bite",photo:"https://images.unsplash.com/photo-1569058242253-92a9c755a0ec?auto=format&fit=crop&w=800&q=85",description:"Fast, flavorful local meals and generous lunch specials."},
      {id:18,name:"Sea Cliff Terrace",cuisine:"Asian",area:"Sea Cliff",price:"TSh 230,000",cost:230000,rating:4.9,distance:4.1,open:"Dinner",facilities:["Parking","Outdoor","Accessible","Wi-Fi"],diet:["Vegetarian","Gluten-free"],tag:"Premium",photo:"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=800&q=85",description:"Refined oceanfront dining with panoramic views and elegant service."}
    ];
    const cuisines=[["All","🍽️"],["African","🥘"],["Italian","🍕"],["Asian","🍣"],["Indian","🍛"],["Cafe","☕"]];
    const saved=new Set(JSON.parse(localStorage.getItem("fork-saved")||"[]"));
    let settings=JSON.parse(localStorage.getItem("fork-settings")||'{"dark":false,"language":"en"}');
    let userProfile=JSON.parse(localStorage.getItem("fork-profile")||'{"name":"Guest","phone":"","email":""}');
    let visitHistory=JSON.parse(localStorage.getItem("fork-history")||"[]");
    let active="All",savedOnly=false,filters={budget:0,location:"All",food:"All",rating:0,hours:"All",facility:"All",diet:"All"};
    const grid=document.getElementById("restaurantGrid"),search=document.getElementById("searchInput"),modal=document.getElementById("modal"),toast=document.getElementById("toast");
    async function loadRestaurants(){try{const response=await fetch("/api/restaurants");if(!response.ok)throw new Error("Could not load restaurants");const databaseRestaurants=await response.json();restaurants=databaseRestaurants.map(item=>{const fallback=restaurants.find(existing=>existing.id===item.id)||{};return{id:item.id,name:item.name,cuisine:item.cuisine,area:item.area,price:`TSh ${Number(item.average_cost_tzs).toLocaleString()}`,cost:item.average_cost_tzs,rating:item.rating,distance:fallback.distance||0,open:item.opening_period,facilities:item.facilities||[],diet:item.dietary_preferences||[],tag:fallback.tag||"Restaurant",photo:item.photo_url||fallback.photo||"",description:item.description||fallback.description||""}});renderCategories();render()}catch(error){console.error(error);showToast("Using offline restaurant data")}}
    function cuisineLabel(name){const sw={All:"Zote",African:"Kiafrika",Italian:"Kiitaliano",Asian:"Kiasia",Indian:"Kihindi",Cafe:"Kahawa"};return settings.language==="sw"?sw[name]:name}
    function renderCategories(){document.getElementById("categories").innerHTML=cuisines.map(([name,icon])=>`<button class="category ${name===active?"active":""}" data-cuisine="${name}"><span class="cat-icon">${icon}</span><span>${cuisineLabel(name)}</span></button>`).join("")}
    function card(r){return `<article class="card" onclick="openRestaurant(${r.id})"><div class="photo" style="background-image:url('${r.photo}')"><span class="tag">${r.tag}</span><button class="save ${saved.has(r.id)?"saved":""}" onclick="toggleSaved(event,${r.id})">${saved.has(r.id)?"♥":"♡"}</button><span class="distance">⌖ ${r.distance} km · ${r.area}</span></div><div class="card-body"><div class="title-line"><h3>${r.name}</h3><span class="rating">★ ${r.rating}</span></div><p class="meta">${r.cuisine} · ${r.area}</p><div class="card-foot"><span class="price">${r.price} per person</span><span class="open-status">OPEN NOW</span></div></div></article>`}
    function render(){const q=search.value.trim().toLowerCase();const budgetMatch=r=>!filters.budget||(filters.budget===200001?r.cost>200000:r.cost<filters.budget);const list=restaurants.filter(r=>(active==="All"||r.cuisine===active)&&(!savedOnly||saved.has(r.id))&&`${r.name} ${r.cuisine} ${r.area}`.toLowerCase().includes(q)&&budgetMatch(r)&&(filters.location==="All"||r.area===filters.location)&&(filters.food==="All"||r.cuisine===filters.food)&&(!filters.rating||r.rating>=filters.rating)&&(filters.hours==="All"||r.open===filters.hours)&&(filters.facility==="All"||r.facilities.includes(filters.facility))&&(filters.diet==="All"||r.diet.includes(filters.diet)));document.getElementById("resultCount").textContent=`${list.length} place${list.length===1?"":"s"} found`;grid.innerHTML=list.length?list.map(card).join(""):'<div class="empty"><strong>No restaurants match</strong>Try clearing one or more filters.</div>';document.getElementById("savedCount").textContent=saved.size;updateFilterCount()}
    function showToast(message){toast.textContent=message;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}
    window.toggleSaved=(event,id)=>{event.stopPropagation();saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem("fork-saved",JSON.stringify([...saved]));showToast(saved.has(id)?"Saved to favorites":"Removed from favorites");render()};
    window.openRestaurant=id=>{const r=restaurants.find(item=>item.id===id);document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="dialog-image" style="background-image:url('${r.photo}')"></div><div class="dialog-copy"><div class="title-line"><h2>${r.name}</h2><span class="rating">★ ${r.rating}</span></div><p>${r.cuisine} · ${r.area} · ${r.distance} km away</p><p>${r.description}</p><div class="actions"><button class="primary" onclick="openReservation(${r.id})">📅 Reserve</button><button class="secondary" onclick="openOrder(${r.id})">🛍 Order</button><button class="direction" onclick="getDirections(${r.id})">⌖ Visit</button></div></div>`;modal.classList.add("open");document.body.style.overflow="hidden"};
    window.openReservation=id=>{const r=restaurants.find(item=>item.id===id);const tomorrow=new Date(Date.now()+86400000).toISOString().split("T")[0];document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="dialog-copy"><button class="flow-back" onclick="openRestaurant(${id})">← Back to restaurant</button><h2>Reserve a table</h2><p>${r.name} · ${r.area}</p><form onsubmit="confirmReservation(event,'${r.name}')"><div class="form-grid"><div class="form-field full"><label>YOUR NAME</label><input required placeholder="Enter your name"></div><div class="form-field"><label>DATE</label><input required type="date" min="${tomorrow}" value="${tomorrow}"></div><div class="form-field"><label>TIME</label><select required><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option></select></div><div class="form-field"><label>GUESTS</label><select required><option>1 guest</option><option selected>2 guests</option><option>3 guests</option><option>4 guests</option><option>5+ guests</option></select></div><div class="form-field"><label>PHONE</label><input required type="tel" placeholder="Phone number"></div></div><button class="confirm" type="submit">Confirm reservation</button></form></div>`};
    window.openOrder=id=>{const r=restaurants.find(item=>item.id===id);const menu=[["Chef's special","Fresh signature plate","TSh 28,000"],["House favorite","Most ordered meal","TSh 21,000"],["Family platter","Perfect for sharing","TSh 56,000"]];document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="dialog-copy"><button class="flow-back" onclick="openRestaurant(${id})">← Back to restaurant</button><h2>Order from ${r.name}</h2><p>Choose items for pickup or delivery.</p><div class="menu-list">${menu.map((item,index)=>`<div class="menu-item"><div><strong>${item[0]}</strong><small>${item[1]}</small></div><b>${item[2]}</b><button class="add-item" onclick="addToOrder(this,${index})">+</button></div>`).join("")}</div><button class="confirm" onclick="finishOrder('${r.name}')">View order · <span id="orderCount">0 items</span></button></div>`};
    window.addToOrder=button=>{button.textContent="✓";button.disabled=true;const count=document.querySelectorAll(".add-item:disabled").length;document.getElementById("orderCount").textContent=`${count} item${count===1?"":"s"}`};
    window.finishOrder=name=>{const count=document.querySelectorAll(".add-item:disabled").length;if(!count)return showToast("Add at least one menu item");closeModal();showToast(`Order started with ${name}`)};
    window.confirmReservation=(event,name)=>{event.preventDefault();closeModal();showToast(`Reservation request sent to ${name}`)};
    window.getDirections=id=>{const r=restaurants.find(item=>item.id===id);visitHistory.unshift({id:r.id,name:r.name,area:r.area,date:new Date().toLocaleString()});visitHistory=visitHistory.slice(0,20);localStorage.setItem("fork-history",JSON.stringify(visitHistory));const destination=encodeURIComponent(`${r.name}, ${r.area}, Dar es Salaam`);window.open(`https://www.google.com/maps/search/?api=1&query=${destination}`,"_blank","noopener");showToast(settings.language==="sw"?"Inafungua ramani":"Opening directions")};
    window.openMenu=()=>{const sw=settings.language==="sw";document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="menu-panel"><div class="menu-head"><div class="avatar">${(userProfile.name||"G").charAt(0).toUpperCase()}</div><div><h2>${userProfile.name||"Guest"}</h2><p>${sw?"Mipangilio ya akaunti":"Account and preferences"}</p></div></div><div class="menu-options"><button class="menu-option" onclick="toggleDarkMode()"><span class="option-icon">◐</span><span>${sw?"Hali ya giza":"Dark mode"}<small>${sw?"Badilisha mwonekano wa programu":"Change the app appearance"}</small></span><span class="switch ${settings.dark?"on":""}"><i></i></span></button><button class="menu-option" onclick="toggleLanguage()"><span class="option-icon">文</span><span>${sw?"Badili kwenda Kiingereza":"Change to Swahili"}<small>${sw?"Lugha ya sasa: Kiswahili":"Current language: English"}</small></span><span class="chevron">›</span></button><button class="menu-option" onclick="openHistory()"><span class="option-icon">↻</span><span>${sw?"Historia ya ziara":"Visit history"}<small>${visitHistory.length} ${sw?"ziara zilizopita":"previous visits"}</small></span><span class="chevron">›</span></button><button class="menu-option" onclick="openProfile()"><span class="option-icon">♙</span><span>${sw?"Wasifu":"Profile"}<small>${sw?"Hariri taarifa zako":"Edit your personal details"}</small></span><span class="chevron">›</span></button></div></div>`;modal.classList.add("open");document.body.style.overflow="hidden"};
    window.toggleDarkMode=()=>{settings.dark=!settings.dark;saveSettings();applySettings();openMenu()};
    window.toggleLanguage=()=>{settings.language=settings.language==="en"?"sw":"en";saveSettings();applyLanguage();openMenu()};
    function saveSettings(){localStorage.setItem("fork-settings",JSON.stringify(settings))}
    function applySettings(){document.body.classList.toggle("dark",settings.dark);applyLanguage()}
    function applyLanguage(){const sw=settings.language==="sw";document.documentElement.lang=sw?"sw":"en";search.placeholder=sw?"Tafuta mgahawa au aina ya chakula...":"Search restaurants or cuisines...";document.querySelector(".hero .pill").textContent=sw?"Karibu nawe sasa":"Near you now";document.querySelector(".hero h1").innerHTML=sw?'Pata sehemu yako <em>uipendayo.</em>':'Find your next <em>favorite.</em>';document.querySelector(".hero p").textContent=sw?"Pata mgahawa, hifadhi meza, agiza chakula, au fungua ramani na utembelee.":"Find a restaurant, reserve your table, order a meal, or get directions and visit.";document.getElementById("explore").innerHTML=(sw?"TAFUTA MGAHAWA":"FIND A RESTAURANT")+' <span>→</span>';document.querySelector(".heading h2").textContent=sw?"Maarufu karibu nawe":"Popular near you";document.getElementById("viewAll").innerHTML=(sw?"Ona Zote":"View All")+' <span>→</span>';const labels=sw?["Nyumbani","Gundua","Tembelea","Ulizohifadhi","Wasifu"]:["Home","Discover","Visit","Saved","Profile"];document.querySelectorAll(".nav-item").forEach((item,index)=>item.lastChild.nodeValue=labels[index]);renderCategories();render()}
    window.openHistory=()=>{const sw=settings.language==="sw";document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="dialog-copy"><button class="flow-back" onclick="openMenu()">← ${sw?"Rudi":"Back"}</button><h2>${sw?"Historia ya ziara":"Visit history"}</h2><p>${sw?"Migahawa uliyofungua kwenye ramani.":"Restaurants you previously opened in maps."}</p><div class="history-list">${visitHistory.length?visitHistory.map(item=>`<div class="history-item"><strong>${item.name}</strong><small>${item.area} · ${item.date}</small></div>`).join(""):`<div class="empty"><strong>${sw?"Hakuna historia bado":"No visits yet"}</strong>${sw?"Fungua maelekezo ya mgahawa kuanza.":"Open restaurant directions to begin."}</div>`}</div>${visitHistory.length?`<button class="clear-filters" style="padding:12px;width:100%" onclick="clearHistory()">${sw?"Futa historia":"Clear history"}</button>`:""}</div>`};
    window.clearHistory=()=>{visitHistory=[];localStorage.removeItem("fork-history");openHistory()};
    window.openProfile=()=>{const sw=settings.language==="sw";document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="dialog-copy"><button class="flow-back" onclick="openMenu()">← ${sw?"Rudi":"Back"}</button><h2>${sw?"Wasifu wako":"Your profile"}</h2><form onsubmit="saveProfile(event)"><div class="form-grid"><div class="form-field full"><label>${sw?"JINA":"NAME"}</label><input name="name" required value="${userProfile.name||""}"></div><div class="form-field full"><label>${sw?"SIMU":"PHONE"}</label><input name="phone" type="tel" value="${userProfile.phone||""}"></div><div class="form-field full"><label>EMAIL</label><input name="email" type="email" value="${userProfile.email||""}"></div></div><button class="confirm">${sw?"Hifadhi wasifu":"Save profile"}</button></form></div>`};
    window.saveProfile=event=>{event.preventDefault();const data=new FormData(event.target);userProfile={name:data.get("name"),phone:data.get("phone"),email:data.get("email")};localStorage.setItem("fork-profile",JSON.stringify(userProfile));showToast(settings.language==="sw"?"Wasifu umehifadhiwa":"Profile saved");openMenu()};
    function filterChoices(name,options,current){return options.map(option=>`<label class="choice"><input type="radio" name="${name}" value="${option.value}" ${String(current)===String(option.value)?"checked":""}><span>${option.label}</span></label>`).join("")}
    window.openFilters=()=>{const groups=[
      ["budget","Budget per person",[{value:0,label:"Any budget"},{value:50000,label:"Below TSh 50,000"},{value:100000,label:"Below TSh 100,000"},{value:150000,label:"Below TSh 150,000"},{value:200001,label:"Above TSh 200,000"}]],
      ["location","Location",["All","Masaki","Oyster Bay","Msasani","Sea Cliff","Mikocheni","Upanga","City Centre","Posta","Kivukoni","Kariakoo","Kinondoni","Kijitonyama","Sinza","Mwenge","Mbezi Beach","Kawe","Kunduchi","Kigamboni"].map(value=>({value,label:value}))],
      ["food","Food type",["All","African","Italian","Asian","Indian","Cafe"].map(value=>({value,label:value}))],
      ["rating","Minimum rating",[{value:0,label:"Any"},{value:4.5,label:"4.5+ ★"},{value:4.7,label:"4.7+ ★"},{value:4.8,label:"4.8+ ★"}]],
      ["hours","Open hours",["All","Breakfast","Lunch","Dinner","Late night"].map(value=>({value,label:value}))],
      ["facility","Facilities",["All","Parking","Wi-Fi","Outdoor","Accessible","Delivery"].map(value=>({value,label:value}))],
      ["diet","Dietary preference",["All","Halal","Vegetarian","Vegan","Gluten-free"].map(value=>({value,label:value}))]
    ];document.getElementById("dialog").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="dialog-copy"><h2>Filter restaurants</h2><p>Choose what matters most to you.</p><form id="filterForm" onsubmit="applyFilters(event)">${groups.map(([name,title,options])=>`<section class="filter-section"><h3>${title}</h3><div class="choice-row">${filterChoices(name,options,filters[name])}</div></section>`).join("")}<div class="filter-footer"><button class="clear-filters" type="button" onclick="clearFilters()">Clear all</button><button class="confirm" type="submit">Show restaurants</button></div></form></div>`;modal.classList.add("open");document.body.style.overflow="hidden"};
    window.applyFilters=event=>{event.preventDefault();const data=new FormData(event.target);filters={budget:Number(data.get("budget")),location:data.get("location"),food:data.get("food"),rating:Number(data.get("rating")),hours:data.get("hours"),facility:data.get("facility"),diet:data.get("diet")};savedOnly=false;closeModal();render();document.getElementById("discover").scrollIntoView();showToast("Filters applied")};
    window.clearFilters=()=>{filters={budget:0,location:"All",food:"All",rating:0,hours:"All",facility:"All",diet:"All"};openFilters();render()};
    function updateFilterCount(){const count=Object.entries(filters).filter(([key,value])=>key==="budget"||key==="rating"?Number(value)>0:value!=="All").length;const badge=document.getElementById("filterCount");badge.textContent=count;badge.classList.toggle("visible",count>0)}
    window.closeModal=()=>{modal.classList.remove("open");document.body.style.overflow=""};
    function showSaved(){savedOnly=true;active="All";renderCategories();render();document.getElementById("discover").scrollIntoView()}
    function useLocation(){if(!navigator.geolocation)return showToast("Location is not supported");navigator.geolocation.getCurrentPosition(()=>showToast("Showing restaurants near you"),()=>showToast("Allow location access to search nearby"))}
    document.getElementById("categories").onclick=e=>{const button=e.target.closest("[data-cuisine]");if(!button)return;active=button.dataset.cuisine;savedOnly=false;renderCategories();render()};
    search.oninput=render;document.getElementById("menuButton").onclick=openMenu;document.getElementById("explore").onclick=()=>document.getElementById("discover").scrollIntoView();document.getElementById("viewAll").onclick=()=>{active="All";savedOnly=false;search.value="";filters={budget:0,location:"All",food:"All",rating:0,hours:"All",facility:"All",diet:"All"};renderCategories();render()};document.getElementById("savedHeader").onclick=showSaved;document.getElementById("filterButton").onclick=openFilters;modal.onclick=e=>{if(e.target===modal)closeModal()};document.onkeydown=e=>{if(e.key==="Escape")closeModal()};
    document.querySelectorAll(".nav-item").forEach(button=>button.onclick=()=>{document.querySelectorAll(".nav-item").forEach(item=>item.classList.remove("active"));button.classList.add("active");const view=button.dataset.view;if(view==="saved")showSaved();else if(view==="map")useLocation();else if(view==="discover")document.getElementById("discover").scrollIntoView();else if(view==="home")scrollTo({top:0,behavior:"smooth"});else if(view==="profile")openProfile()});
    applySettings();loadRestaurants();
  </script>
</body>
