<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Fork restaurant discovery app" />
    <title>Fork — Find Your Next Table</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap");
      :root {
        /* Warm 60-30-10 restaurant palette: neutral base, espresso, appetite accent. */
        --orange: #b93f1d;
        --orange-bright: #f29a52;
        --orange-soft: #fce8d8;
        --cream: #fff8ee;
        --ink: #271812;
        --muted: #71675f;
        --line: #eadfd3;
        --paper: #fffdf9;
        --success: #28734d;
        --shadow: 0 12px 36px #3d21151f;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        width: min(1180px, 100%);
        min-height: 100vh;
        margin: auto;
        padding: 0 28px 110px;
      }
      .topbar {
        height: 92px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        display: grid;
        place-items: center;
        font-size: 22px;
      }
      .icon-btn:hover {
        background: var(--orange-soft);
      }
      .menu,
      .menu:before,
      .menu:after {
        width: 23px;
        height: 2px;
        background: currentColor;
        display: block;
        content: "";
        position: relative;
      }
      .menu:before {
        position: absolute;
        top: -7px;
      }
      .menu:after {
        position: absolute;
        top: 7px;
      }
      .brand {
        text-align: center;
        line-height: 1;
      }
      .brand-mark {
        display: block;
        color: var(--orange);
        font-size: 27px;
      }
      .brand strong {
        font:
          800 23px "Playfair Display",
          serif;
      }
      .brand small {
        display: block;
        margin-top: 5px;
        font-size: 8px;
        letter-spacing: 2.4px;
        font-weight: 800;
        color: var(--muted);
      }
      .header-actions {
        justify-self: end;
        display: flex;
      }
      .notify {
        position: relative;
      }
      .notify b {
        position: absolute;
        right: 1px;
        top: 1px;
        min-width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--orange);
        color: white;
        font-size: 9px;
        display: grid;
        place-items: center;
        border: 2px solid var(--cream);
      }
      .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin: 8px 0 20px;
      }
      .search-box {
        min-height: 58px;
        background: white;
        box-shadow: 0 8px 25px #4d361f14;
        border: 1px solid var(--line);
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
      }
      .search-box span {
        font-size: 24px;
      }
      .search-box input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
      }
      .filter-btn {
        width: 58px;
        border: 0;
        border-radius: 18px;
        background: white;
        box-shadow: 0 8px 25px #4d361f14;
        font-size: 22px;
        position: relative;
      }
      .filter-count {
        position: absolute;
        right: -5px;
        top: -5px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--orange);
        color: white;
        font-size: 10px;
        font-weight: 800;
        display: none;
        place-items: center;
      }
      .filter-count.visible {
        display: grid;
      }
      .hero {
        min-height: 330px;
        border-radius: 28px;
        overflow: hidden;
        position: relative;
        background: #24130d;
        color: white;
        display: flex;
        align-items: center;
        padding: 45px 50px;
      }
      .hero:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            #24130d 0%,
            #24130df2 37%,
            #24130d5c 74%,
            #24130d14
          ),
          url("001.jpg")
            center/cover;
      }
      .hero-copy {
        position: relative;
        z-index: 1;
        width: min(480px, 58%);
      }
      .pill {
        display: inline-block;
        padding: 7px 11px;
        border-radius: 999px;
        background: var(--orange);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .hero h1 {
        font:
          800 clamp(38px, 5vw, 65px) / 0.98 "Playfair Display",
          serif;
        letter-spacing: -2px;
        margin: 16px 0 14px;
      }
      .hero h1 em {
        color: var(--orange-bright);
        font-style: normal;
      }
      .hero p {
        color: #d8d3cc;
        font-size: 14px;
        line-height: 1.6;
      }
      .cta {
        border: 0;
        border-radius: 999px;
        background: var(--orange);
        color: white;
        padding: 14px 20px;
        font-weight: 800;
      }
      .cta span {
        display: inline-grid;
        place-items: center;
        margin-left: 8px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: white;
        color: var(--orange);
      }
      .dots {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
        z-index: 2;
      }
      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffffff88;
      }
      .dots i:first-child {
        width: 21px;
        border-radius: 99px;
        background: var(--orange);
      }
      .categories {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 18px;
        margin: 30px 0 36px;
      }
      .category {
        border: 0;
        background: transparent;
        text-align: center;
        font-weight: 700;
      }
      .cat-icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 9px;
        border-radius: 50%;
        background: white;
        border: 2px solid transparent;
        box-shadow: 0 8px 22px #53331317;
        display: grid;
        place-items: center;
        font-size: 34px;
        transition: 0.2s;
      }
      .category:hover .cat-icon,
      .category.active .cat-icon {
        border-color: var(--orange);
        background: var(--orange-soft);
        transform: translateY(-3px);
      }
      .category span:last-child {
        font-size: 13px;
      }
      .heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .discover-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 18px;
        scrollbar-width: none;
      }
      .discover-tabs::-webkit-scrollbar {
        display: none;
      }
      .discover-tab {
        flex: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 800;
      }
      .discover-tab.active {
        border-color: var(--orange);
        background: var(--orange);
        color: white;
      }
      .heading h2 {
        margin: 0;
        font:
          800 30px "Playfair Display",
          serif;
      }
      .heading p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .view-all {
        border: 0;
        background: transparent;
        font-weight: 700;
      }
      .view-all span {
        color: var(--orange);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .card {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: white;
        overflow: hidden;
        box-shadow: 0 7px 18px #3c29140f;
        transition: 0.2s;
        cursor: pointer;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow);
      }
      .photo {
        height: 190px;
        position: relative;
        background-position: center;
        background-size: cover;
      }
      .photo:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, #00000059, transparent 55%);
      }
      .tag {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 12px;
        padding: 6px 9px;
        border-radius: 999px;
        background: var(--orange);
        color: white;
        text-transform: uppercase;
        font-size: 9px;
        font-weight: 800;
      }
      .save {
        position: absolute;
        z-index: 2;
        right: 12px;
        top: 12px;
        width: 35px;
        height: 35px;
        border: 0;
        border-radius: 50%;
        background: white;
        font-size: 18px;
      }
      .save.saved {
        color: var(--orange);
      }
      .distance {
        position: absolute;
        z-index: 1;
        bottom: 12px;
        left: 12px;
        color: white;
        font-size: 11px;
        font-weight: 700;
      }
      .card-body {
        padding: 16px;
      }
      .title-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .title-line h3 {
        margin: 0;
        font-size: 17px;
      }
      .rating {
        flex: none;
        font-size: 12px;
        font-weight: 800;
        color: #765000;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        margin: 7px 0 14px;
      }
      .card-foot {
        display: flex;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid #f1ebe3;
      }
      .price {
        font-weight: 800;
        font-size: 13px;
      }
      .open-status {
        color: var(--success);
        font-size: 11px;
        font-weight: 800;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 60px 20px;
        background: white;
        border-radius: 22px;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 20px;
      }
      .offer {
        min-height: 170px;
        margin-top: 28px;
        padding: 28px 36px;
        border-radius: 24px;
        color: white;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        background: #24130d;
      }
      .offer:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #24130d 0 45%, transparent 75%),
          url("002.jpg")
            right center/60% auto no-repeat;
      }
      .offer-copy {
        position: relative;
        z-index: 1;
      }
      .offer small {
        color: var(--orange-bright);
        font-weight: 800;
      }
      .offer h2 {
        margin: 7px 0;
        font:
          800 28px/1.05 "Playfair Display",
          serif;
      }
      .offer p {
        color: #cfc7bf;
        margin: 0;
        font-size: 12px;
      }
      .bottom-nav {
        position: fixed;
        z-index: 20;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(1180px, 100%);
        min-height: 76px;
        padding: 9px 20px max(9px, env(safe-area-inset-bottom));
        background: #fffdf9f5;
        border-top: 1px solid var(--line);
        backdrop-filter: blur(16px);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }
      .nav-item {
        border: 0;
        background: transparent;
        color: #4b4843;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
      }
      .nav-icon {
        font-size: 21px;
        height: 26px;
      }
      .nav-item.active {
        color: var(--orange);
      }
      .nav-item.main .nav-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--orange);
        color: white;
        display: grid;
        place-items: center;
        font-size: 22px;
        margin-top: -29px;
        box-shadow: 0 8px 22px #ed641757;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 50;
        inset: 0;
        padding: 18px;
        background: #140f0ab8;
        backdrop-filter: blur(7px);
        place-items: center;
      }
      .modal.open {
        display: grid;
      }
      .dialog {
        width: min(620px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: white;
        border-radius: 26px;
        position: relative;
      }
      .dialog-image {
        height: 270px;
        background-position: center;
        background-size: cover;
      }
      .close {
        position: absolute;
        z-index: 2;
        right: 14px;
        top: 14px;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: white;
        font-size: 20px;
      }
      .dialog-copy {
        padding: 25px;
      }
      .dialog-copy h2 {
        margin: 0;
        font:
          800 32px "Playfair Display",
          serif;
      }
      .dialog-copy p {
        color: var(--muted);
        line-height: 1.65;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-top: 18px;
      }
      .primary,
      .secondary,
      .direction {
        border: 0;
        border-radius: 14px;
        padding: 13px 10px;
        font-weight: 800;
        color: white;
      }
      .primary {
        background: var(--orange);
      }
      .secondary {
        background: var(--ink);
      }
      .direction {
        background: var(--orange-soft);
        color: var(--orange);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 18px 0;
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-field.full {
        grid-column: 1/-1;
      }
      .form-field label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
      }
      .form-field input,
      .form-field select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--cream);
      }
      .filter-section {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .filter-section h3 {
        font-size: 13px;
        margin: 0 0 10px;
      }
      .choice-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .choice {
        position: relative;
      }
      .choice input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .choice span {
        display: block;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .choice input:checked + span {
        background: var(--ink);
        border-color: var(--ink);
        color: white;
      }
      .filter-footer {
        position: sticky;
        bottom: 0;
        background: white;
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 10px;
        padding-top: 18px;
      }
      .clear-filters {
        border: 1px solid var(--line);
        background: white;
        border-radius: 14px;
        font-weight: 800;
      }
      .menu-list {
        display: grid;
        gap: 10px;
        margin: 18px 0;
      }
      .menu-item {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .menu-item small {
        display: block;
        color: var(--muted);
      }
      .menu-item.unavailable {
        opacity: 0.68;
        background: var(--cream);
      }
      .availability-badge {
        display: inline-block;
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #f5d8d1;
        color: #8e2f1a;
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .add-item:disabled {
        cursor: not-allowed;
        background: var(--muted);
      }
      .owner-section {
        margin: 20px 0;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .owner-section h3 {
        margin: 0 0 6px;
      }
      .owner-section > p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
      }
      .owner-food {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .owner-food small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .danger-button {
        align-self: center;
        border: 1px solid #e5b8ae;
        border-radius: 10px;
        background: transparent;
        color: #9b321c;
        padding: 8px 10px;
        font-weight: 800;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        font-size: 12px;
        font-weight: 700;
      }
      .add-item {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        background: var(--orange);
        color: white;
        font-size: 18px;
      }
      .flow-back {
        border: 0;
        background: transparent;
        color: var(--orange);
        font-weight: 800;
        padding: 0 0 12px;
      }
      .confirm {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: var(--orange);
        color: white;
        padding: 14px;
        font-weight: 800;
      }
      .toast {
        position: fixed;
        z-index: 70;
        left: 50%;
        bottom: 92px;
        transform: translate(-50%, 100px);
        background: var(--ink);
        color: white;
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 12px;
        opacity: 0;
        transition: 0.25s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .menu-panel {
        padding: 26px;
      }
      .menu-head {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 8px 45px 22px 0;
        border-bottom: 1px solid var(--line);
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--orange);
        color: white;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 800;
      }
      .menu-head h2 {
        font:
          800 25px "Playfair Display",
          serif;
        margin: 0;
      }
      .menu-head p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .menu-options {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }
      .menu-option {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 16px;
        padding: 15px;
        display: flex;
        align-items: center;
        gap: 13px;
        text-align: left;
        font-weight: 800;
      }
      .menu-option .option-icon {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: var(--orange-soft);
        color: var(--orange);
        display: grid;
        place-items: center;
        font-size: 18px;
      }
      .menu-option small {
        display: block;
        color: var(--muted);
        font-weight: 500;
        margin-top: 3px;
      }
      .menu-option .chevron {
        margin-left: auto;
      }
      .switch {
        margin-left: auto;
        width: 46px;
        height: 26px;
        border-radius: 99px;
        background: #d8d3cc;
        padding: 3px;
      }
      .switch i {
        display: block;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: white;
        transition: 0.2s;
      }
      .switch.on {
        background: var(--orange);
      }
      .switch.on i {
        transform: translateX(20px);
      }
      .history-list {
        display: grid;
        gap: 10px;
        margin: 18px 0;
      }
      .history-item {
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .history-item strong {
        display: block;
      }
      .history-item small {
        color: var(--muted);
      }
      body.dark {
        --cream: #17100d;
        --ink: #fff8ee;
        --muted: #c0b4aa;
        --line: #48362e;
        --paper: #241a16;
        --orange: #e56f3f;
        --orange-bright: #ffad68;
        --orange-soft: #43271d;
        --success: #69bd8e;
        --shadow: 0 12px 36px #0006;
      }
      body.dark .search-box,
      body.dark .filter-btn,
      body.dark .cat-icon,
      body.dark .card,
      body.dark .dialog,
      body.dark .bottom-nav,
      body.dark .form-field input,
      body.dark .form-field select,
      body.dark .empty,
      body.dark .filter-footer {
        background: var(--paper);
        color: var(--ink);
      }
      body.dark .choice span,
      body.dark .clear-filters {
        background: var(--paper);
        color: var(--ink);
      }
      body.dark .choice input:checked + span {
        background: var(--orange);
        border-color: var(--orange);
        color: white;
      }

        showToast("Filters applied");
      };
      window.clearFilters = () => {
        filters = {
          budget: 0,
          location: "All",
          food: "All",
          rating: 0,
          hours: "All",
          facility: "All",
          diet: "All",
        };
        openFilters();
        render();
      };
      function updateFilterCount() {
        const count = Object.entries(filters).filter(([key, value]) =>
          key === "budget" || key === "rating"
            ? Number(value) > 0
            : value !== "All",
        ).length;
        const badge = document.getElementById("filterCount");
        badge.textContent = count;
        badge.classList.toggle("visible", count > 0);
      }
      window.closeModal = () => {
        modal.classList.remove("open");
        document.body.style.overflow = "";
      };
      function showSaved() {
        savedOnly = true;
        active = "All";
        renderCategories();
        render();
        document.getElementById("discover").scrollIntoView();
      }
      function useLocation() {
        if (!navigator.geolocation)
          return showToast("Location is not supported");
        navigator.geolocation.getCurrentPosition(
          () => showToast("Showing restaurants near you"),
          () => showToast("Allow location access to search nearby"),
        );
      }
      document.getElementById("discoverTabs").onclick = (event) => {
        const button = event.target.closest("[data-discovery]");
        if (!button) return;
        discoveryMode = button.dataset.discovery;
        savedOnly = false;
        render();
      };
      document.getElementById("categories").onclick = (e) => {
        const button = e.target.closest("[data-cuisine]");
        if (!button) return;
        active = button.dataset.cuisine;
        savedOnly = false;
        renderCategories();
        render();
      };
      search.oninput = render;
      updateLocationSuggestions();
      document.getElementById("menuButton").onclick = openMenu;
      document.getElementById("explore").onclick = () =>
        document.getElementById("discover").scrollIntoView();
      document.getElementById("viewAll").onclick = () => {
        active = "All";
        discoveryMode = "popular";
        savedOnly = false;
        search.value = "";
        filters = {
          budget: 0,
          location: "All",
          food: "All",
          rating: 0,
          hours: "All",
          facility: "All",
          diet: "All",
        };
        renderCategories();
        render();
      };
      document.getElementById("savedHeader").onclick = showSaved;
      document.getElementById("filterButton").onclick = openFilters;
      modal.onclick = (e) => {
        if (e.target === modal) closeModal();
      };
      document.onkeydown = (e) => {
        if (e.key === "Escape") closeModal();
      };
      document.querySelectorAll(".nav-item").forEach(
        (button) =>
          (button.onclick = () => {
            document
              .querySelectorAll(".nav-item")
              .forEach((item) => item.classList.remove("active"));
            button.classList.add("active");
            const view = button.dataset.view;
            if (view === "saved") showSaved();
            else if (view === "map") useLocation();
            else if (view === "discover")
              document.getElementById("discover").scrollIntoView();
            else if (view === "home") scrollTo({ top: 0, behavior: "smooth" });
            else if (view === "profile") openProfile();
          }),
      );
      applySettings();
      loadRestaurants();
    </script>
  </body>
</html>
